<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tone Poster</title>
  <style>
    :root{--paper:#fbf9f2;--ink:#20201e;--line:#dedbd3}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Noto Sans TC",sans-serif}.app{width:min(720px,100%);margin:auto;padding:18px 18px 42px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:4px 2px 16px;margin-bottom:18px}.brand{font-size:15px;font-weight:800;letter-spacing:.12em}.top button,.action,select{border:1px solid var(--line);background:#fffef9;color:var(--ink);padding:10px 13px;font-weight:700;letter-spacing:.06em;font-size:12px;cursor:pointer}.top button:hover,.action:hover{background:#efede7}.canvas-wrap{display:grid;place-items:center;background:#f2eee7;padding:16px;min-height:360px}.canvas-wrap canvas{width:min(100%,480px);aspect-ratio:1;display:block;background:#f3e8dd;box-shadow:0 10px 24px #0002}.chips{display:flex;align-items:center;gap:10px;padding:16px 0;border-bottom:1px solid var(--line)}.chips span{font-size:11px;font-weight:800;letter-spacing:.08em;margin-right:auto}.chip{height:28px;width:28px;border:2px solid #fff;outline:1px solid #bbb;cursor:pointer}.chip.active{outline:2px solid #111;transform:scale(1.08)}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.controls{display:grid;gap:15px;padding-top:5px}.row{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:14px}.row label{font-size:12px;font-weight:800;letter-spacing:.06em}.row select,.row input{width:100%}.row input[type=range]{accent-color:#1d1d1b}.hint{font-size:12px;color:#716c66;margin:18px 0 0;line-height:1.6}.download{width:100%;margin-top:22px;padding:15px;border:0;background:#242421;color:white;font-size:13px;font-weight:800;letter-spacing:.1em;cursor:pointer}.download:hover{background:#55504a}@media(max-width:470px){.app{padding:14px}.row{grid-template-columns:100px 1fr}.actions{font-size:10px}.canvas-wrap{min-height:300px}}
  </style>
</head>
<body><main class="app">
  <header class="top"><div class="brand">TONE POSTER</div><button id="pick">IMAGE&nbsp; +</button><input id="file" type="file" accept="image/*" hidden></header>
  <section class="canvas-wrap"><canvas id="poster" width="900" height="900" aria-label="瘚瑕?汗"></canvas></section>
  <section class="chips"><span>INK COLORS</span><button class="chip active" data-color="#eb6b75" style="background:#eb6b75"></button><button class="chip" data-color="#197ea8" style="background:#197ea8"></button><button class="chip" data-color="#151515" style="background:#151515"></button><button class="chip" data-color="#00a56e" style="background:#00a56e"></button><button class="chip" data-color="#ff7c35" style="background:#ff7c35"></button></section>
  <section class="actions"><button class="action" id="random">??RANDOM</button><button class="action" id="style">??STYLE</button><button class="action" id="frame">??FRAME</button></section>
  <section class="controls"><div class="row"><label for="pattern">SCREEN</label><select id="pattern"><option value="dot">Round dot</option><option value="cross">Cross hatch</option><option value="square">Square dot</option></select></div><div class="row"><label for="paper">PAPER</label><select id="paper"><option value="#f2e7dd">Warm cream</option><option value="#fffdf5">Soft white</option><option value="#e9f0e7">Pale mint</option><option value="#ffead3">Apricot</option></select></div><div class="row"><label for="density">FREQUENCY</label><input id="density" type="range" min="18" max="80" value="48"></div><div class="row"><label for="corner">CORNER</label><input id="corner" type="range" min="0" max="24" value="4"></div></section>
  <button class="download" id="download">DOWNLOAD PNG</button><p class="hint">?????其???蝵桃汗?其葉摰?????抒?銝?銝??/p>
</main><script>
const canvas=document.querySelector('#poster'),ctx=canvas.getContext('2d'),file=document.querySelector('#file');
const state={ink:['#eb6b75','#197ea8','#151515'],selected:0,paper:'#f2e7dd',pattern:'dot',density:48,corner:4,img:null};
function starter(){const c=document.createElement('canvas');c.width=c.height=260;const x=c.getContext('2d');x.fillStyle='#2082a7';x.fillRect(0,0,260,260);x.strokeStyle='#121719';x.lineWidth=4;[[35,55],[92,72],[150,40],[198,91],[230,58],[67,145],[125,125],[190,155],[42,214],[160,212],[222,228]].forEach(([a,b])=>{x.beginPath();x.moveTo(a-8,b+4);x.lineTo(a,b-4);x.lineTo(a+9,b+4);x.stroke()});const i=new Image();i.src=c.toDataURL();return i}state.img=starter();state.img.onload=draw;
function draw(){const n=state.density,step=900/n;ctx.clearRect(0,0,900,900);ctx.fillStyle=state.paper;ctx.fillRect(0,0,900,900);ctx.save();const r=state.corner*9;ctx.beginPath();ctx.roundRect(0,0,900,900,r);ctx.clip();const off=document.createElement('canvas');off.width=off.height=n;const ox=off.getContext('2d');const im=state.img,ratio=Math.max(n/im.width,n/im.height);const w=im.width*ratio,h=im.height*ratio;ox.drawImage(im,(n-w)/2,(n-h)/2,w,h);const px=ox.getImageData(0,0,n,n).data;for(let y=0;y<n;y++)for(let x=0;x<n;x++){const p=(y*n+x)*4,l=(px[p]*.213+px[p+1]*.715+px[p+2]*.072)/255;const layer=Math.min(2,Math.floor((1-l)*3));const rad=(1-l)*step*.62;ctx.fillStyle=state.ink[layer];ctx.strokeStyle=state.ink[layer];const cx=(x+.5)*step,cy=(y+.5)*step;if(state.pattern==='cross'){ctx.lineWidth=Math.max(1,rad*.7);ctx.beginPath();ctx.moveTo(cx-rad,cy-rad);ctx.lineTo(cx+rad,cy+rad);ctx.moveTo(cx+rad,cy-rad);ctx.lineTo(cx-rad,cy+rad);ctx.stroke()}else if(state.pattern==='square')ctx.fillRect(cx-rad,cy-rad,rad*2,rad*2);else{ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.fill()}}ctx.restore();ctx.strokeStyle='#d9d2c9';ctx.lineWidth=3;ctx.strokeRect(1.5,1.5,897,897)}
document.querySelector('#pick').onclick=()=>file.click();file.onchange=e=>{const f=e.target.files[0];if(!f)return;const i=new Image();i.onload=()=>{state.img=i;draw()};i.src=URL.createObjectURL(f)};
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{state.ink[state.selected]=b.dataset.color;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.selected=(state.selected+1)%3;draw()});
document.querySelector('#pattern').onchange=e=>{state.pattern=e.target.value;draw()};document.querySelector('#paper').onchange=e=>{state.paper=e.target.value;draw()};document.querySelector('#density').oninput=e=>{state.density=+e.target.value;draw()};document.querySelector('#corner').oninput=e=>{state.corner=+e.target.value;draw()};
document.querySelector('#style').onclick=()=>{state.pattern=['dot','cross','square'][(['dot','cross','square'].indexOf(state.pattern)+1)%3];document.querySelector('#pattern').value=state.pattern;draw()};document.querySelector('#frame').onclick=()=>{state.corner=state.corner?0:18;document.querySelector('#corner').value=state.corner;draw()};document.querySelector('#random').onclick=()=>{const p=['#eb6b75','#197ea8','#151515','#00a56e','#ff7c35'];state.ink=[p[Math.floor(Math.random()*p.length)],p[Math.floor(Math.random()*p.length)],p[Math.floor(Math.random()*p.length)]];state.density=18+Math.floor(Math.random()*62);state.pattern=['dot','cross','square'][Math.floor(Math.random()*3)];state.corner=Math.floor(Math.random()*22);document.querySelector('#density').value=state.density;document.querySelector('#corner').value=state.corner;document.querySelector('#pattern').value=state.pattern;draw()};
document.querySelector('#download').onclick=()=>{const a=document.createElement('a');a.download='tone-poster.png';a.href=canvas.toDataURL('image/png');a.click()};
</script></body></html>
